name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_STABLE_SIGNING: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Fetch stable signing material from Render using GitHub OIDC
        if: env.HAS_STABLE_SIGNING == 'true'
        shell: bash
        env:
          SIGNING_ENDPOINT: https://chk-binance-workspace-mcp.onrender.com/ci/android-signing
        run: |
          set -euo pipefail
          TOKEN_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=chk-crypto-signing")"
          OIDC_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$TOKEN_JSON")"
          SIGNING_JSON="$(curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Accept: application/json" \
            "$SIGNING_ENDPOINT")"
          export SIGNING_JSON
          python - <<'PY'
          import base64, json, os
          data = json.loads(os.environ['SIGNING_JSON'])
          if data.get('ok') is not True:
              raise SystemExit('Render did not return signing material')
          for secret in (data['keystoreBase64'], data['storePassword'], data['keyPassword']):
              print(f'::add-mask::{secret}')
          runner_temp = os.environ['RUNNER_TEMP']
          keystore_path = os.path.join(runner_temp, 'chk-crypto-stable.jks')
          props_path = os.path.join(runner_temp, 'chk-crypto-signing.properties')
          keystore = base64.b64decode(data['keystoreBase64'], validate=True)
          with open(keystore_path, 'wb') as f:
              f.write(keystore)
          os.chmod(keystore_path, 0o600)
          with open(props_path, 'w', encoding='utf-8') as f:
              f.write(f'keystorePath={keystore_path}\n')
              f.write(f'storePassword={data["storePassword"]}\n')
              f.write(f'keyAlias={data["keyAlias"]}\n')
              f.write(f'keyPassword={data["keyPassword"]}\n')
          os.chmod(props_path, 0o600)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'CHK_SIGNING_PROPERTIES_PATH={props_path}\n')
          PY
          unset SIGNING_JSON OIDC_TOKEN TOKEN_JSON

      - name: Build stable signed release APK
        if: env.HAS_STABLE_SIGNING == 'true'
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify stable APK signature
        if: env.HAS_STABLE_SIGNING == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/chk-crypto-signing-certificate.txt"
          cp "$APK" "app/build/outputs/apk/release/CHK-Crypto-v0.6.4-stable.apk"

      - name: Upload stable signed APK
        if: env.HAS_STABLE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CHK-Crypto-v0.6.4-stable-signed
          path: |
            app/build/outputs/apk/release/CHK-Crypto-v0.6.4-stable.apk
            ${{ runner.temp }}/chk-crypto-signing-certificate.txt
          if-no-files-found: error
          retention-days: 30

      - name: Build debug APK for pull request validation
        if: env.HAS_STABLE_SIGNING != 'true'
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug validation APK
        if: env.HAS_STABLE_SIGNING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CHK-Crypto-v0.6.4-debug-validation
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
