name: Temporary tracking patch
on:
  push:
    branches: [feature/tracking-v010]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tracking-v010
      - name: Patch WallTrackerEngine nullable asset
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/chk/binancebybit/WallTrackerEngine.kt')
          s=p.read_text()
          old='val asset = if (exchange == "BINANCE") reverseBinance[symbol] else reverseBybit[symbol] ?: return'
          new='val asset = (if (exchange == "BINANCE") reverseBinance[symbol] else reverseBybit[symbol]) ?: return'
          if old not in s:
              print('Already patched')
          else:
              p.write_text(s.replace(old,new))
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/chk/binancebybit/WallTrackerEngine.kt
          git commit -m "fix(tracking): resolve held asset before processing orderbook"
          git push origin HEAD:feature/tracking-v010
